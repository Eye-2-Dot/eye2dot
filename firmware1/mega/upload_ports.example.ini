; COM 포트 지정 견본 (선택 사항)
;
; 보드를 하나만 꽂으면 PlatformIO 가 포트를 자동으로 찾으므로 이 파일은 필요 없다.
; Mega 와 ESP32 를 같이 꽂아서 다른 보드에 올라가거나 모니터가 엉뚱한 보드를 열 때만:
;   1. 이 파일을 같은 폴더에 upload_ports.ini 로 복사한다 (저장소에는 올라가지 않는다)
;   2. 아래 두 줄 앞의 ; 를 지우고 COM 번호를 적는다
;      번호 찾기: Windows 장치 관리자 → 포트(COM & LPT), 또는 pio device list
;
; 이 견본 파일은 PlatformIO 가 읽지 않는다. 한 번만 바꿔 올리려면 대신
;   pio run -t upload --upload-port COM3

[env:mega]
; upload_port  = COM3
; monitor_port = COM3
