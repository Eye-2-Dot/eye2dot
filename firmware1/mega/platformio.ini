; Eye 2 Dot — 펌웨어 1 / ATmega2560 (Arduino Mega): 스피커·솔레노이드·버튼
; 빌드: pio run   업로드: pio run -t upload   모니터: pio device monitor
; VS Code 에서는 이 mega 폴더를 열어야 PlatformIO 가 인식한다.

[platformio]
; COM 포트는 컴퓨터마다 달라서 저장소에 적지 않는다.
; 두 보드를 같이 꽂아 자동 인식이 헷갈릴 때만 upload_ports.example.ini 를
; upload_ports.ini 로 복사해 번호를 적는다 (.gitignore 됨). 파일이 없으면 그냥 넘어간다.
extra_configs = upload_ports.ini

[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino

monitor_speed = 115200
upload_speed = 115200

; -I ../common          : 두 칩 공통 시리얼 약속 (firmware1/common/protocol.h)
; SERIAL_RX_BUFFER_SIZE : 시리얼 수신 버퍼 64 → 256바이트. 음성 조각(최대 256B)이 통째로 들어간다.
;                         실제로 쓰는 Serial(USB)·Serial1(ESP32) 두 개만 RAM 을 더 쓴다 (+384B)
build_flags =
    -I ../common
    -DSERIAL_RX_BUFFER_SIZE=256
