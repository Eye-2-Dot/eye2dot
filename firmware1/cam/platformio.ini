; Eye 2 Dot — 펌웨어 1 / ESP32-CAM: 카메라·Wi-Fi·서버 통신
; 빌드: pio run   업로드: pio run -t upload   모니터: pio device monitor
; VS Code 에서는 이 cam 폴더를 열어야 PlatformIO 가 인식한다.

[platformio]
; COM 포트는 컴퓨터마다 달라서 저장소에 적지 않는다.
; 두 보드를 같이 꽂아 자동 인식이 헷갈릴 때만 upload_ports.example.ini 를
; upload_ports.ini 로 복사해 번호를 적는다 (.gitignore 됨). 파일이 없으면 그냥 넘어간다.
extra_configs = upload_ports.ini

[env:esp32cam]
platform  = espressif32 @ ^6.4.0      ; Arduino 코어 2.0.x
board     = esp32cam                  ; AI Thinker ESP32-CAM
framework = arduino

; -I ../common : 두 칩 공통 시리얼 약속 (firmware1/common/protocol.h)
; PSRAM 사용 (Arduino IDE의 "PSRAM: Enabled"에 해당)
build_flags =
    -I ../common
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

board_build.partitions = huge_app.csv   ; Wi-Fi + 카메라 + JSON이면 기본 파티션이 빠듯함

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

upload_speed  = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder   ; 리부팅 시 원인 줄 번호 표시

; ESP32-CAM-MB 보드: 모니터를 열면 RTS/DTR 때문에 리셋·부팅모드에 묶이는 문제 방지
monitor_rts = 0
monitor_dtr = 0
