; Eye 2 Dot — 펌웨어 1 부품 시험: 카드 이송 스텝 모터 (pins.h: PIN_TAPE_*)
; 빌드: pio run   업로드: pio run -t upload   모니터: pio device monitor

[env:stepper_test]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

; -I ../../mega/include : 핀 번호 pins.h (완성 펌웨어와 같은 파일)
; -I ../_shared         : mega 시험 공용 (솔레노이드 끄기, 입력 되돌려 찍기)
build_flags =
    -I ../../mega/include
    -I ../_shared
