; Eye 2 Dot — 펌웨어 1 부품 시험: 스텝 모터 2개 (헤드 PIN_HEAD_*, 카드 랙 PIN_CARD_*)
; 빌드: pio run   업로드: pio run -t upload   모니터: pio device monitor

[env:stepper_test]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

; -I ../../mega/include : 핀 번호 pins.h, 모터 조정값 motion.h (완성 펌웨어와 같은 파일)
; -I ../../common       : motion.h 가 쓰는 protocol.h
; -I ../_shared         : mega 시험 공용 (솔레노이드 끄기, 입력 되돌려 찍기)
build_flags =
    -I ../../mega/include
    -I ../../common
    -I ../_shared
