; Eye 2 Dot — 펌웨어 1 부품 시험: ESP32-CAM 연결선 (Mega 쪽, Serial1 = D19·D18)
; 빌드: pio run   업로드: pio run -t upload   모니터: pio device monitor
; ESP32-CAM 에는 cam_link_test 를 올려 같이 쓴다

[env:link_test]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

; -I ../../mega/include : 핀 번호 pins.h (완성 펌웨어와 같은 파일)
; -I ../../common       : protocol.h 의 통신 속도 LINK_BAUD (두 칩 공용)
; -I ../_shared         : mega 시험 공용 (솔레노이드 끄기, 입력 되돌려 찍기)
build_flags =
    -I ../../mega/include
    -I ../../common
    -I ../_shared
