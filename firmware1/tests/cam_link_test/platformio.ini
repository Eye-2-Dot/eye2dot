; Eye 2 Dot — 펌웨어 1 부품 시험: Mega 연결선 (ESP32-CAM 쪽, Serial2 = GPIO14·15)
; 빌드: pio run   업로드: pio run -t upload   모니터: pio device monitor
; Mega 에는 link_test 를 올려 같이 쓴다. Wi-Fi 를 쓰지 않으므로 secrets.h 가 필요 없다.

[env:cam_link_test]
platform  = espressif32 @ ^6.4.0      ; 완성 cam 펌웨어와 같은 플랫폼
board     = esp32cam                  ; AI Thinker ESP32-CAM
framework = arduino

; -I ../../cam/include : link.h 의 PIN_LINK_RX·PIN_LINK_TX (완성 cam 펌웨어와 같은 핀)
; -I ../../common      : protocol.h 의 통신 속도 LINK_BAUD (두 칩 공용)
build_flags =
    -I ../../cam/include
    -I ../../common

upload_speed  = 460800
monitor_speed = 115200

; ESP32-CAM-MB 보드: 모니터를 열면 RTS/DTR 때문에 리셋·부팅모드에 묶이는 문제 방지
monitor_rts = 0
monitor_dtr = 0
