; Eye 2 Dot — 펌웨어 2 부품 시험: 솔레노이드 6개 (D22~D27)
; 빌드: pio run   업로드: pio run -t upload   모니터: pio device monitor
; tools/solenoid_mask_test/solenoid_mask_test.ino 를 PlatformIO 로 옮긴 것

[env:solenoid_test]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

; -I ../../mega/include : pins.h (PIN_SOL), solenoid.h (SOL_PULSE_MS·SOL_COOLDOWN_MS — 완성 펌웨어와 같은 값)
; -I ../_shared         : mega 시험 공용 (솔레노이드 끄기, 입력 되돌려 찍기)
build_flags =
    -I ../../mega/include
    -I ../_shared
