; 부품별 시험 프로그램 (Mega). 펌웨어 1 회로와 펌웨어 2 회로 둘 다 이 프로그램으로 확인합니다.
;   펌웨어 1 회로:  pio run -e fw1 -t upload && pio device monitor -b 115200
;   펌웨어 2 회로:  pio run -e fw2 -t upload && pio device monitor -b 115200
[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

[env:fw1]
build_flags = -DBENCH_FW=1

[env:fw2]
build_flags = -DBENCH_FW=2
