; 통신 확인 프로그램 (ESP32). Wi-Fi, 서버, Mega 연결을 따로따로 확인합니다.
;   펌웨어 2 의 ESP32 개발 보드:  pio run -e fw2 -t upload && pio device monitor -b 115200
;   펌웨어 1 의 ESP32-CAM      :  pio run -e fw1cam -t upload && pio device monitor -b 115200
; 먼저 include/secrets.example.h 를 include/secrets.h 로 복사해 내용을 채웁니다.
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

[env:fw2]
board = esp32dev
build_flags = -DLINK_RX=16 -DLINK_TX=17 -DDEVICE_ID=\"fw2\"

[env:fw1cam]
board = esp32cam
build_flags = -DLINK_RX=14 -DLINK_TX=15 -DDEVICE_ID=\"fw1\"
; ESP32-CAM 은 모니터를 열 때 재시작 신호가 걸리지 않게 함
monitor_rts = 0
monitor_dtr = 0
