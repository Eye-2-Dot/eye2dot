; Eye 2 Dot — 펌웨어 2 (책 점역기) / ATmega2560 (Arduino Mega): 솔레노이드·스텝 모터
; 빌드: pio run   업로드: pio run -t upload   모니터: pio device monitor
; VS Code 에서는 이 mega 폴더를 열어야 PlatformIO 가 인식한다. (펌웨어 1 mega 와 같은 방식)

[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino

monitor_speed = 115200
upload_speed = 115200

; -I ../common : 펌웨어 2 의 두 칩(ESP32 · Mega) 공통 약속 (아직 비어 있음)
build_flags =
    -I ../common
